name: Kotlin

on:
  schedule:
    - cron: "0 9 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DEVELOCITY_URL: "https://ge.solutions-team.gradle.com"
  GIT_REPO: "https://github.com/JetBrains/kotlin"
  TASKS: "install"
  ARGS: "-Pkotlin.test.maxParallelForks=4 -Dorg.gradle.dependency.verification=off"

jobs:
  Experiment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - experimentId: 1
          - experimentId: 2
          - experimentId: 3
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 6
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 6
          distribution: "zulu"
      - name: Set up JDK 7
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 7
          distribution: "zulu"
      - name: Set up JDK 9
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 9
          distribution: "zulu"
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 17
          distribution: "temurin"
      - name: Display toolchain
        run: |
          touch settings.gradle
          gradle -q javaToolchains ${{ env.ARGS }}
        shell: bash
      - name: Add git hook to temporarily disable caching for kotlin-dom-api-compat:compileKotlinJs (KT-56690)
        run: |
          mkdir ~/git-hooks
          echo -e 'echo "\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.Kotlin2JsCompile>().configureEach { outputs.doNotCacheIf(\"https://youtrack.jetbrains.com/issue/KT-56690\") { true } }" >> libraries/kotlin-dom-api-compat/build.gradle.kts\n' > ~/git-hooks/post-checkout
          chmod +x ~/git-hooks/post-checkout
          git config --global core.hooksPath ~/git-hooks
      - name: Add git hook to temporarily disable caching for kotlin-power-assert-runtime (KT-50876)
        if: matrix.experimentId == 3
        run: |
          cat >> ~/git-hooks/post-checkout << 'HOOK'
          echo "\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinNativeCompile>().configureEach { outputs.doNotCacheIf(\"https://youtrack.jetbrains.com/issue/KT-50876\") { true } }" >> plugins/power-assert/power-assert-runtime/build.gradle.kts
          echo "\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompileCommon>().configureEach { outputs.doNotCacheIf(\"https://youtrack.jetbrains.com/issue/KT-50876\") { true } }" >> plugins/power-assert/power-assert-runtime/build.gradle.kts
          echo "\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.Kotlin2JsCompile>().configureEach { outputs.doNotCacheIf(\"https://youtrack.jetbrains.com/issue/KT-50876\") { true } }" >> plugins/power-assert/power-assert-runtime/build.gradle.kts
          echo "\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { outputs.doNotCacheIf(\"https://youtrack.jetbrains.com/issue/KT-50876\") { true } }" >> plugins/power-assert/power-assert-runtime/build.gradle.kts
          HOOK
      - name: Download latest version of the validation scripts
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/download@actions-stable
        with:
          downloadDevelopmentRelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure validation scripts network settings
        uses: gradle/develocity-oss-projects/.github/actions/configure-validation-scripts-network-settings@main
      - name: Get Develocity access token with workload identity
        id: develocity-oidc
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          oidc=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://ge.solutions-team.gradle.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc"
          token=$(curl -sSf -X POST -H "Authorization: Bearer $oidc" \
            "https://ge.solutions-team.gradle.com/api/auth/token?expiresInHours=6")
          echo "::add-mask::$token"
          echo "access-key=ge.solutions-team.gradle.com=$token" >> "$GITHUB_OUTPUT"
      - name: Run experiment 1
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-1@actions-stable
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.access-key }}
        with:
          gitRepo: ${{ env.GIT_REPO }}
          tasks: ${{ env.TASKS }}
          args: ${{ env.ARGS }}
          develocityUrl: ${{ env.DEVELOCITY_URL }}
        if: matrix.experimentId == 1
      - name: Run experiment 2
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-2@actions-stable
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.access-key }}
        with:
          gitRepo: ${{ env.GIT_REPO }}
          tasks: ${{ env.TASKS }}
          args: ${{ env.ARGS }}
          develocityUrl: ${{ env.DEVELOCITY_URL }}
          failIfNotFullyCacheable: true
        if: matrix.experimentId == 2
      - name: Run experiment 3
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-3@actions-stable
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.access-key }}
        with:
          gitRepo: ${{ env.GIT_REPO }}
          tasks: ${{ env.TASKS }}
          args: ${{ env.ARGS }}
          develocityUrl: ${{ env.DEVELOCITY_URL }}
          failIfNotFullyCacheable: true
        if: matrix.experimentId == 3
