name: Apollo Kotlin

on:
  schedule:
    - cron: "0 13 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DEVELOCITY_URL: "https://solutions.develocity.cloud"
  GIT_REPO: "https://github.com/apollographql/apollo-kotlin"
  # Exclude flaky WebSocketNetworkTransportTest on Android debug target.
  # The same commonTest tests still run via jvmTest and other KMP targets.
  TASKS: "build -x :apollo-gradle-plugin:test -x :apollo-runtime:testDebugUnitTest"

jobs:
  Experiment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - experimentId: 1
          - experimentId: 2
          - experimentId: 3
    runs-on: macos-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 17
          distribution: "temurin"
      - name: Download latest version of the validation scripts
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/download@actions-stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure validation scripts network settings
        uses: gradle/develocity-oss-projects/.github/actions/configure-validation-scripts-network-settings@main
      - name: Get Develocity access token
        id: develocity-oidc
        uses: gradle/develocity-oss-projects/.github/actions/get-develocity-access-token@main
      - name: Run experiment 1
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-1@actions-stable
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.access-key }}
        with:
          gitRepo: ${{ env.GIT_REPO }}
          tasks: ${{ env.TASKS }}
          develocityUrl: ${{ env.DEVELOCITY_URL }}
        if: matrix.experimentId == 1
      - name: Run experiment 2
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-2@actions-stable
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.access-key }}
        with:
          gitRepo: ${{ env.GIT_REPO }}
          tasks: ${{ env.TASKS }}
          develocityUrl: ${{ env.DEVELOCITY_URL }}
          failIfNotFullyCacheable: true
        if: matrix.experimentId == 2
      - name: Run experiment 3
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-3@actions-stable
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.access-key }}
        with:
          gitRepo: ${{ env.GIT_REPO }}
          tasks: ${{ env.TASKS }}
          develocityUrl: ${{ env.DEVELOCITY_URL }}
          failIfNotFullyCacheable: true
        if: matrix.experimentId == 3
