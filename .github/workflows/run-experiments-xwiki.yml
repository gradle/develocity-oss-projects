name: XWiki Commons

on:
  schedule:
    - cron: "0 17 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DEVELOCITY_URL: "https://solutions.develocity.cloud"
  GIT_REPO: "https://github.com/xwiki/xwiki-commons"
  GOALS: "install"
  ARGS: "-B"

jobs:
  Experiment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - experimentId: 1
          - experimentId: 2
    runs-on: ubuntu-latest
    steps:
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@5d4481650d2563723ad6c5e8f009ac8fd746e3e8 # v1.22.0
        with:
          checkout-fetch-depth: 0
          java-version: 21
          java-distribution: temurin
          maven-version: 3.9.6
      - name: Configure Maven settings
        run: >
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <profiles>
                <profile>
                  <id>xwiki</id>
                  <repositories>
                    <repository>
                      <id>xwiki-snapshots</id>
                      <name>XWiki Nexus Snapshot Repository Proxy</name>
                      <url>https://nexus.xwiki.org/nexus/content/groups/public-snapshots</url>
                      <releases><enabled>false</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                    <repository>
                      <id>xwiki-releases</id>
                      <name>XWiki Nexus Releases Repository Proxy</name>
                      <url>https://nexus.xwiki.org/nexus/content/groups/public</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>false</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>xwiki-snapshots</id>
                      <name>XWiki Nexus Plugin Snapshot Repository Proxy</name>
                      <url>https://nexus.xwiki.org/nexus/content/groups/public-snapshots</url>
                      <releases><enabled>false</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                    <pluginRepository>
                      <id>xwiki-releases</id>
                      <name>XWiki Nexus Plugin Releases Repository Proxy</name>
                      <url>https://nexus.xwiki.org/nexus/content/groups/public</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>false</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>xwiki</activeProfile>
              </activeProfiles>
            </settings>' > ~/.m2/settings.xml
      - name: Download latest version of the validation scripts
        uses: gradle/develocity-build-validation-scripts/.github/actions/maven/download@actions-stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure validation scripts network settings
        uses: gradle/develocity-oss-projects/.github/actions/configure-validation-scripts-network-settings@main
      - name: Get Develocity access token
        id: develocity-oidc
        uses: gradle/develocity-oss-projects/.github/actions/get-develocity-access-token@main
      - name: Run experiment 1
        uses: gradle/develocity-build-validation-scripts/.github/actions/maven/experiment-1@actions-stable
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.access-key }}
        with:
          gitRepo: ${{ env.GIT_REPO }}
          goals: ${{ env.GOALS }}
          args: ${{ env.ARGS }}
          develocityUrl: ${{ env.DEVELOCITY_URL }}
          failIfNotFullyCacheable: true
        if: matrix.experimentId == 1
      - name: Run experiment 2
        uses: gradle/develocity-build-validation-scripts/.github/actions/maven/experiment-2@actions-stable
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.access-key }}
        with:
          gitRepo: ${{ env.GIT_REPO }}
          goals: ${{ env.GOALS }}
          args: ${{ env.ARGS }}
          develocityUrl: ${{ env.DEVELOCITY_URL }}
          failIfNotFullyCacheable: true
        if: matrix.experimentId == 2
