name: Get Develocity access token
description: "Exchanges a GitHub OIDC token for a short-lived Develocity access token using workload identity"

inputs:
  develocityHost:
    description: "The Develocity server host to get the access token for"
    default: "solutions.develocity.cloud"
    required: false
  oidcAudience:
    description: "The audience of the GitHub OIDC token, matching a workload identity rule on the server"
    default: "https://solutions.develocity.cloud"
    required: false
  expiresInHours:
    description: "The lifetime of the access token in hours"
    default: "6"
    required: false

outputs:
  access-key:
    description: "The access key in host=token form, to be used as DEVELOCITY_ACCESS_KEY. Empty if no GitHub OIDC token is available."
    value: ${{ steps.get-token.outputs.access-key }}

runs:
  using: "composite"
  steps:
    - name: Get Develocity access token with workload identity
      id: get-token
      env:
        DEVELOCITY_HOST: ${{ inputs.develocityHost }}
        OIDC_AUDIENCE: ${{ inputs.oidcAudience }}
        EXPIRES_IN_HOURS: ${{ inputs.expiresInHours }}
      run: |
        if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
          echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
          exit 0
        fi
        oidc=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          --data-urlencode "audience=${OIDC_AUDIENCE}" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
        echo "::add-mask::$oidc"
        token=$(curl -sSf -X POST -H "Authorization: Bearer $oidc" \
          "https://${DEVELOCITY_HOST}/api/auth/token?expiresInHours=${EXPIRES_IN_HOURS}")
        echo "::add-mask::$token"
        echo "access-key=${DEVELOCITY_HOST}=$token" >> "$GITHUB_OUTPUT"
      shell: bash
